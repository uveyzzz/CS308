spring:
  application:
    name: store
  # Optional backend/.env file (KEY=VALUE lines, gitignored). See .env.example.
  config:
    import: optional:file:.env[.properties]
  datasource:
    # Defaults point at the local Postgres from docker-compose.yml.
    # For Supabase, set DB_URL / DB_USERNAME / DB_PASSWORD in backend/.env.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/store}
    username: ${DB_USERNAME:store}
    password: ${DB_PASSWORD:store}
    hikari:
      # Supabase's pooler has a small connection limit that the whole team shares.
      maximum-pool-size: ${DB_POOL_SIZE:5}
  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only checks that entities match it.
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  jwt:
    # No default on purpose: this repo is public, and anyone who knows the secret
    # can forge a manager's token. Set JWT_SECRET in backend/.env.
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
