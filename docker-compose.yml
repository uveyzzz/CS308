# Local development database. Start it with:  docker compose up -d
# The backend's default settings connect to it with no extra configuration.
services:
  db:
    image: postgres:16-alpine
    container_name: cs308-db
    environment:
      POSTGRES_DB: store
      POSTGRES_USER: store
      POSTGRES_PASSWORD: store
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U store -d store"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
